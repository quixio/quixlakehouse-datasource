<?xml version="1.0" encoding="UTF-8"?>
<!--
  Quix icon mark, 2025. Geometry is the official asset ("Quix icon logo 2025 (mono)")
  unchanged; only the fill is parameterised.

  Note for editors: XML forbids a double hyphen inside a comment, and an invalid SVG
  renders as a broken-image icon in Grafana with nothing in the logs to say why. Keep
  prose here free of them.

  WHY THE MEDIA QUERY: plugin.json has exactly one logo pair (small and large) and no
  theme variants, so a single file has to read on both a light and a dark background.
  The brand ships two mono variants and each is invisible against its own colour: white
  on grafana.com's light catalog page, navy on Grafana's default dark theme.

  The base fill is the DARK navy deliberately. If a renderer ignores
  prefers-color-scheme, the fallback is the variant that still shows on the catalog
  listing, which is the most public place this appears.

  Caveat: prefers-color-scheme follows the OS setting, not Grafana's own theme toggle,
  so a light-theme Grafana on a dark-mode machine still gets the white mark. The
  unconditional alternative is the mark on a filled navy tile, which changes the asset
  rather than just its colour.
-->
<!--
  width/height as well as viewBox: without them an <img> gives the SVG no intrinsic size
  and the browser falls back to 150x150, so the art is scaled by an arbitrary factor
  before Grafana's own CSS box takes over. Measured in the browser: 150x150 without,
  132x132 with.
-->
<svg id="Layer_2" xmlns="http://www.w3.org/2000/svg" width="132" height="132" viewBox="0 0 132 132">
  <style>
    .quix-mark { fill: #0a0b24; }
    @media (prefers-color-scheme: dark) {
      .quix-mark { fill: #ffffff; }
    }
  </style>
  <g id="Layer_1-2">
    <rect class="quix-mark" x="108" y="108" width="24" height="24" rx="2.5" ry="2.5" stroke-width="0"/>
    <rect class="quix-mark" x="81" y="81" width="24" height="24" rx="2.5" ry="2.5" stroke-width="0"/>
    <rect class="quix-mark" x="54" y="54" width="24" height="24" rx="2.5" ry="2.5" stroke-width="0"/>
    <path class="quix-mark" d="M129.5,0H2.5C1.12,0,0,1.12,0,2.5v127c0,1.38,1.12,2.5,2.5,2.5h73c1.38,0,2.5-1.12,2.5-2.5v-19c0-1.38-1.12-2.5-2.5-2.5H24V24h84v51.5c0,1.38,1.12,2.5,2.5,2.5h19c1.38,0,2.5-1.12,2.5-2.5V2.5c0-1.38-1.12-2.5-2.5-2.5Z" stroke-width="0"/>
  </g>
</svg>
