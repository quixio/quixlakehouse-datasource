# Build, lint and test gate.
#
# Split into independent jobs so a frontend lint failure does not mask a backend test
# failure -- the two halves of this plugin fail for unrelated reasons.
#
# NOTE: there are currently no Go tests and no frontend tests. `go test ./...` passes
# trivially with no test files, and `test:ci` runs jest with --passWithNoTests. This
# workflow is therefore a real gate for lint/vet/typecheck/build today, and becomes a
# real test gate as soon as tests land. CLAUDE.md names Go unit tests (macro expansion,
# epoch conversion, Arrow->frame, error classification) as layer 1 and the place the
# logic risk actually lives.

name: ci

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'bug/**'
      - 'fix/**'
  pull_request:
    branches:
      - main

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # ci, not install: fails on a package-lock that disagrees with package.json
      # rather than silently resolving something else.
      - run: npm ci --no-audit --no-fund

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci

      # Proves the webpack build works, which is what deploy/Dockerfile stage 1 does.
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      # Installed with `go install` rather than golangci-lint-action, deliberately.
      # The action ships a prebuilt binary, and a binary built with an older Go refuses
      # to analyse a module targeting a newer one ("the Go language version used to
      # build golangci-lint is lower than the targeted Go version"). Building from
      # source uses this runner's toolchain, so it tracks go.mod automatically and
      # cannot drift out of step again.
      #
      # /v2 in the module path matches `version: '2'` in .golangci.yml.
      - name: golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          golangci-lint run ./...

      # The plugin binary is what makes this datasource work server-side, so a build
      # break here is the whole feature, not a detail.
      - name: build plugin binary
        run: |
          go install github.com/magefile/mage@latest
          mage -v build:linux

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Filesystem scan covers go.sum and package-lock.json without needing the image
      # built first, so it runs in parallel with the other two jobs.
      #
      # Report-only for now (exit-code 0). Turning this into a blocking gate is a
      # deliberate decision that needs a triage pass first -- failing CI on
      # unactionable transitive CVEs trains people to ignore it.
      # @master, not a pinned tag: aquasecurity/trivy-action's release tags are not
      # reliably resolvable (0.28.0 does not exist as a ref, which failed the first
      # run of this workflow). Their README recommends master. Acceptable here because
      # the job is report-only -- a surprise from a floating action cannot break the
      # build while exit-code stays 0.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table

  # deploy/entrypoint.sh is the boot path for every Quix deployment and has grown to
  # ~700 lines of POSIX sh. Two review rounds found bugs in it that only execute when
  # something else has already gone wrong -- an unreadable state copy, a failed lock --
  # which is exactly the code a human reader skims. Nothing else in CI parses it: the
  # frontend and backend jobs never touch deploy/, and a syntax error here would first
  # surface as a container that will not boot.
  #
  # Blocking, unlike the Trivy job: shellcheck findings on a file this size are
  # actionable and few, and a parse error is never acceptable.
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dash, not bash: the script runs under Alpine BusyBox sh, and bash would accept
      # bashisms that fail in the image.
      - name: Parse with a POSIX shell
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq dash
          for f in deploy/entrypoint.sh deploy/test/entrypoint-test.sh; do
            echo "dash -n $f"
            dash -n "$f"
          done

      - name: shellcheck
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck --shell=sh --severity=warning deploy/entrypoint.sh deploy/test/entrypoint-test.sh

  # Exercises deploy/entrypoint.sh's state machine end to end, in a real
  # container, against dummy lakehouse credentials -- it never touches a real
  # lakehouse and never asserts on datasource connectivity. It exists because
  # three review rounds each found a defect in a branch that only executes
  # after something else already failed (an unreadable state copy, a corrupt
  # copy, a lock that cannot be taken, a skipped restore left set) -- exactly
  # the code a human reviewer skims, and none of it reachable by the `shell`
  # job's dash -n / shellcheck static checks above. Blocking: a regression
  # here is a boot-time state machine bug on every Quix deployment.
  entrypoint-state-machine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: build image
        run: docker build -f deploy/Dockerfile -t quixlakehouse-grafana:test .

      - name: run entrypoint state-machine tests
        run: sh deploy/test/entrypoint-test.sh quixlakehouse-grafana:test
