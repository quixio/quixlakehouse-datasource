# Packages the plugin as a Grafana-installable zip, validates it, and attaches it to a
# GitHub Release.
#
# This is what makes the plugin installable by anyone who is NOT deploying our Grafana
# image -- i.e. `GF_INSTALL_PLUGINS=<url>;quix-quixlakehouse-datasource`, or unzipping
# into /var/lib/grafana/plugins. It is also the artefact a Grafana catalog submission
# points at, which is why the validator runs here and not only on PRs: a tag must never
# publish an archive the catalog would reject.
#
# The build and packaging steps live in .github/actions/package-plugin, shared with
# .github/workflows/plugin-validator.yml so both produce the same archive. The reason the
# archive is laid out the way it is ("THE LAYOUT IS THE WHOLE JOB") is documented in that
# action's header -- read it before changing anything about the zip.
#
# Alternative worth knowing: grafana/plugin-actions/build-plugin does this and signing in
# one step. Prefer it once we actually want a signature; until then this is fewer moving
# parts and the layout is visible in the diff.

name: release

on:
  push:
    tags:
      - 'v*'
  # Lets us produce and inspect a zip without cutting a real tag.
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_ID: quix-quixlakehouse-datasource

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: v
        run: |
          # A tag is authoritative; a manual run falls back to package.json so the
          # artefact is still named something meaningful.
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Packaging version $VERSION"

      - name: Package plugin
        id: pkg
        uses: ./.github/actions/package-plugin
        with:
          plugin-id: ${{ env.PLUGIN_ID }}
          version: ${{ steps.v.outputs.version }}

      # Uploaded BEFORE validation, deliberately: if the validator rejects the archive
      # the run fails, and the artefact is then the only way to inspect what was actually
      # built. Upload after validation and a red run leaves nothing behind.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.zip }}
          path: |
            ${{ steps.pkg.outputs.zip }}
            ${{ steps.pkg.outputs.sha1 }}

      # ...and validation runs BEFORE the release is attached, so a tag can never publish
      # an archive that a Grafana catalog submission would reject. See the action header
      # for what it checks and why it needs the source tree.
      - name: Validate plugin
        uses: ./.github/actions/validate-plugin
        with:
          zip: ${{ steps.pkg.outputs.zip }}

      - name: Attach to release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            "${{ steps.pkg.outputs.zip }}" \
            "${{ steps.pkg.outputs.sha1 }}" \
          || gh release upload "${GITHUB_REF_NAME}" \
            "${{ steps.pkg.outputs.zip }}" \
            "${{ steps.pkg.outputs.sha1 }}" --clobber
