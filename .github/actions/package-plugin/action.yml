# Builds the frontend and every backend platform, then packages dist/ into the archive
# Grafana can actually install.
#
# THE LAYOUT IS THE WHOLE JOB. Grafana discovers a plugin by directory name, which must
# equal the plugin id. Zipping `dist/` produces an archive containing a folder called
# "dist", which Grafana silently ignores -- the plugin simply never appears, with no
# error to explain why. So we rename to the plugin id before zipping.
#
# Lifted out of .github/workflows/release.yml so that .github/workflows/plugin-validator.yml
# validates a byte-identical archive to the one a tag ships. A validator gate that tests a
# differently-built zip tests nothing.

name: Package plugin
description: >-
  Builds the frontend and all backend platforms with mage, then packages dist/ as
  <plugin-id>-<version>.zip with a two-column .sha1 sidecar. The calling job must have
  already run actions/setup-node and actions/setup-go -- this action installs neither
  toolchain.

inputs:
  plugin-id:
    description: >-
      Plugin id. Becomes the archive's root directory name and the zip filename prefix.
    required: true
  version:
    description: >-
      Version to stamp into package.json (and therefore plugin.json) before building.
      Leave empty to package whatever the checked-out package.json already says.
    required: false
    default: ''

outputs:
  zip:
    description: Filename of the packaged archive, relative to the workspace root.
    value: ${{ steps.pkg.outputs.zip }}
  sha1:
    description: Filename of the sha1sum sidecar, relative to the workspace root.
    value: ${{ steps.pkg.outputs.sha1 }}

runs:
  using: composite
  steps:
    - name: Build frontend
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        npm ci --no-audit --no-fund
        # The tag is the single source of truth for the version. webpack substitutes
        # %VERSION% in plugin.json from package.json (.config/webpack/webpack.config.ts:27),
        # so without this the zip is named from the tag while plugin.json carries
        # whatever package.json happened to say. Grafana reads plugin.json, and the
        # plugin validator rejects the mismatch at catalog submission -- v0.0.1 shipped
        # with exactly that defect before this step existed.
        #
        # An empty version means "package what the tree already says". That is what the
        # validator workflow wants: it hands the validator this same checkout as source
        # code, and the packagejson analyzer raises packagecode-version-mismatch if the
        # source package.json and the archive's plugin.json disagree. Stamping a version
        # there would manufacture exactly that mismatch.
        if [ -n "${VERSION}" ]; then
          npm version "${VERSION}" --no-git-tag-version --allow-same-version
        fi
        npm run build

    # Default mage target is build.BuildAll, which cross-compiles every platform.
    # A single-platform zip would work on our own image and fail for anyone else.
    # It is also what satisfies the validator's backendbinary analyzer, which errors
    # unless the archive carries a linux/amd64 gpx_* executable.
    - name: Build backend (all platforms)
      shell: bash
      run: |
        set -euo pipefail
        go install github.com/magefile/mage@latest
        mage -v

    - name: Package
      id: pkg
      shell: bash
      env:
        PLUGIN_ID: ${{ inputs.plugin-id }}
      run: |
        set -euo pipefail
        # Read the effective version back out of package.json rather than trusting the
        # input: with an empty `version` input the effective version is whatever the
        # checkout already held, and the zip name must match plugin.json either way.
        VERSION="$(node -p "require('./package.json').version")"
        OUT="${PLUGIN_ID}-${VERSION}.zip"

        # The exec bit is not preserved by every build path, and Grafana will not
        # launch a backend it cannot execute -- the symptom is the plugin loading as
        # frontend-only, with no error naming the cause.
        chmod +x dist/gpx_* || true

        mkdir -p pkg-root
        cp -r dist "pkg-root/${PLUGIN_ID}"

        # -r keeps the directory entry; zip preserves the exec bit on Linux.
        ( cd pkg-root && zip -qr "../${OUT}" "${PLUGIN_ID}" )

        # Standard two-column format, so `sha1sum -c` can verify it. Writing the
        # bare hash produced a file no tool would read -- the catalog submission
        # wants the value pasted in, which is still the first field here.
        sha1sum "${OUT}" > "${OUT}.sha1"

        echo "zip=${OUT}" >> "$GITHUB_OUTPUT"
        echo "sha1=${OUT}.sha1" >> "$GITHUB_OUTPUT"

        # The listing is captured once and fed to head as a here-string: under `pipefail`
        # a `unzip -l | head` pipeline can fail the step with exit 141, because head closes
        # the pipe after 20 lines while unzip is still writing the rest.
        LISTING="$(unzip -l "${OUT}")"
        echo "### Packaged" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"
        head -20 <<<"$LISTING" >> "$GITHUB_STEP_SUMMARY"
        echo '```' >> "$GITHUB_STEP_SUMMARY"

    # Fail loudly here rather than shipping an archive that installs to nothing.
    - name: Verify layout
      shell: bash
      env:
        PLUGIN_ID: ${{ inputs.plugin-id }}
        ZIP: ${{ steps.pkg.outputs.zip }}
      run: |
        set -euo pipefail
        # Same trap as the listing in the Package step: under `pipefail` a
        # `unzip -l | grep -q` pipeline can fail a perfectly good archive with exit 141,
        # because grep exits at the first match while unzip is still writing. So the
        # listing is captured first and matched with here-strings, with no pipe involved.
        LISTING="$(unzip -l "$ZIP")"
        grep -q "${PLUGIN_ID}/plugin.json" <<<"$LISTING" \
          || { echo "FATAL: ${PLUGIN_ID}/plugin.json missing -- wrong root directory"; exit 1; }
        grep -q "${PLUGIN_ID}/gpx_" <<<"$LISTING" \
          || { echo "FATAL: no gpx_ backend binary -- plugin would load frontend-only"; exit 1; }
        echo "layout OK"
