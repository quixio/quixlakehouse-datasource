# Config for grafana/plugin-validator-cli, passed as -config by
# .github/actions/validate-plugin.
#
# Scope: this file shapes OUR CI run only. Grafana enforces its own config when it
# validates a catalog submission and never reads this one. Their shipped
# config/pipeline.yaml is exactly the `global` block below with no analyzers section, so
# that is where we start, and we pin two rules to `error`.
#
# govulncheck-issue-found -- an escalation, warning -> error. It ships as a `warning`, but
# the 2026-09-07 submission report carried 35 stdlib vulnerabilities behind that single
# warning (the toolchain was Go 1.25.5, already EOL then; we are on Go 1.26.6 now, see
# go.mod), and a warning nobody reads is exactly how the Trivy job in
# .github/workflows/ci.yml became decorative.
#
# govulncheck-scan-failed -- pinned to `error`, which is also its shipped default. History
# worth one paragraph: between 2026-09-10 and the release of plugin-validator v0.49.0 it
# was demoted to a warning here, because the image's govulncheck was a Go 1.26 build that
# aborted the SOURCE scan of our tree before inspecting anything
# (grafana/plugin-validator issue #827, fixed by PR #851). v0.49.0 ships that fix, and we
# now declare a Go version its pinned toolchain can load, so the source scan runs and the
# rule is restored. The pin is written out rather than inherited so that an upstream
# change of default cannot quietly turn it back into a warning -- a scan that fails for a
# reason genuinely ours, a malformed go.mod or a module that will not resolve, must stop
# CI.
#
# If an unfixable upstream finding ever wedges CI on a rule here, lower it the same way --
# and record in this comment both why, and the observable event that reverts it. Do not
# silence anything by deleting the analyzers block, and do not reach for -analyzer
# filtering in the action.

global:
  enabled: true
  jsonOutput: false
  reportAll: false

analyzers:
  govulncheck:
    rules:
      govulncheck-issue-found:
        severity: error
      govulncheck-scan-failed:
        severity: error
